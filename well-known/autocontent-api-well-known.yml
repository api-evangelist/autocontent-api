source: >-
  Anonymous HTTPS probes of /.well-known/* on every host this record knows — the registrable
  domain and www, the API baseURL host, every OpenAPI servers[] host, the docs host, the app host,
  the MCP host named in llms.txt, and auth.autocontentapi.com, which is the authorization_servers
  entry the MCP protected-resource documents point at.
description: >-
  AutoContent API publishes no security.txt, api-catalog or ai-plugin.json anywhere. It does
  publish real OAuth discovery: two RFC 9728 protected-resource documents on mcp.autocontentapi.com
  (one for the legacy MCP resource, one at the /v1 path for the Platform resource) and full RFC 8414
  authorization-server metadata plus OIDC discovery on auth.autocontentapi.com. app.autocontentapi.com
  answers 200 with the same SPA shell for every /.well-known/ path and serves no document at any of
  them — recorded as misses, not hits.
