platform_api_pricing:
  model: prepaid-payg
  currency: USD
  plans: 0
  docs: https://autocontentapi.com/developers/concepts/pricing
  rate_card_published: false
  mechanics:
  - The preview endpoint returns the authoritative per-Asset and total USD quote before any work.
  - Acceptance requires an explicit max_cost_usd at or above the quote.
  - The accepted service value is reserved before provider work begins.
  - Funds are added as prepaid USD service balance through the Platform app or POST /billing/prepayment-session.
  - Content Loops carry max_cost_per_run_usd and max_cost_per_month_usd ceilings.
  note: >-
    plans: 0 for the Platform API is the finding, not a gap. There is no tier and no published
    price list — the provider deliberately makes the live preview the only price source and states
    that "client code must not calculate or cache customer prices". A buyer cannot estimate cost
    from any public page; they must hold an account and call preview.
discrepancies:
- note: >-
    An earlier round of this profile recorded a fourth legacy tier, "High Volume" at EUR 166/month
    with 20,000 credits and 90 assets/day. That tier is not on the pricing page as of 2026-09-04;
    the third tier is now named Enterprise at EUR 108/month annual. The stale figures survive in
    the apis.yml common[] RateLimits data block and are corrected in this round.
