method: searched
source: https://autocontentapi.com/#pricing
description: >-
  AutoContent API sells two unrelated pricing models at once. The legacy Content API is sold as
  monthly credit subscriptions in EUR (with a USD toggle) — Amateur, Professional and Enterprise,
  plus a separate Private Notebooks license. The Platform API v1 is NOT sold on a plan at all: it is
  prepaid pay-as-you-go in USD, quoted per Generation by a preview endpoint, with no tier, no
  monthly commitment and no published rate card. Prices below are the published EUR figures read
  from the pricing section on 2026-09-04; the page also offers a USD toggle whose figures were not
  captured.
plan_count: 4
currency: EUR
currency_options: [EUR, USD]
billing_periods: [monthly, annual]
free_tier: false
trial: false
