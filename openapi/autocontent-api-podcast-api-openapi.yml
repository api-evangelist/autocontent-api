          example: AI-Generated Tech Talk
        description:
          type: string
          description: Show description for platform listings and RSS feed
          example: Weekly tech discussions generated by AI, covering the latest in technology and innovation.
        author:
          type: string
          description: Host/author name displayed on podcast platforms
          example: AI Content Creator
        link:
          type: string
          format: uri
          description: Official website URL for the podcast show
          example: https://mywebsite.com/podcast
        imageUrl:
          type: string
          format: uri
          description: URL of the podcast show image/artwork
          example: https://mywebsite.com/podcast-artwork.jpg
        email:
          type: string
          format: email
          description: Owner email address for RSS feed and platform registration
          example: podcast@mywebsite.com
        language:
          type: string
          description: Primary language for generated podcast episodes (defaults to English)
          example: Italian
    PodcastEpisode:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the episode
        podcastId:
          type: string
          description: ID of the podcast show this episode belongs to
        requestId:
          type: string
          description: ID of the client request that created the source audio content
        title:
          type: string
          description: Episode title (displayed on podcast platforms)
        description:
          type: string
          description: Episode description (displayed on podcast platforms)
        audioTitle:
          type: string
          description: Original title from the generated audio content
        audioUrl:
          type: string
          description: Direct URL to the episode audio file (MP3 format for platform compatibility)
        requestedOn:
          type: string
          format: date-time
          description: When the episode was requested/created
        succeededOn:
          type: string
          format: date-time
          description: When the episode processing completed successfully
        scheduledOn:
          type: string
          format: date-time
          description: When the episode is scheduled to be published (if scheduled)
        fileSize:
          type: integer
          description: Audio file size in bytes (required for RSS enclosure tag)
        durationSeconds:
          type: integer
          description: Episode duration in seconds (displayed on podcast platforms)
    PodcastShow:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the podcast show
        name:
          type: string
          description: Name of the podcast show (displayed on Spotify, Apple Music, etc.)
        description:
          type: string
          description: Description of the podcast show (used in platform listings)
        author:
          type: string
          description: Author/host name (displayed on podcast platforms)
        link:
          type: string
          description: Website link for the podcast show
        email:
