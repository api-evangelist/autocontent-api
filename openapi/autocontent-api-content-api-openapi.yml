  /content/Schedule:
    post:
      summary: Schedule multiple podcasts
      description: Create multiple podcasts at once, scheduled at intervals from a start time. Supports two modes - URLs mode (one podcast per episode, with each episode containing multiple URLs) or cached sources mode (feedSelections and/or youtubeChannels). Either 'urls' or (feedSelections/youtubeChannels + numberOfEpisodes) must be provided, but not both.
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - frequency
              oneOf:
              - required:
                - urls
              - required:
                - feedSelections
                - numberOfEpisodes
              - required:
                - youtubeChannels
                - numberOfEpisodes
              properties:
                urls:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                      format: uri
                  description: Array of episodes, where each episode is an array of URLs to create a podcast from (URLs mode - cannot be used with feedSelections or youtubeChannels)
                  example:
                  - - https://example.com/article1
                    - https://example.com/article2
                  - - https://example.com/article3
                feedSelections:
                  type: array
                  description: Cached feed items to include in scheduled episodes (cannot be used with urls)
                  items:
                    $ref: '#/components/schemas/FeedSelection'
                  example:
                  - feedId: 1
                    feedItemIds:
                    - post-123
                    - post-456
                numberOfEpisodes:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Number of episodes to create (required when using feedSelections or youtubeChannels)
                  example: 5
                youtubeChannels:
                  type: array
                  items:
                    type: string
                  description: Array of connected YouTube channel IDs to pull recent videos from (cannot be used with urls)
                  example:
                  - yt-channel-1
                  - yt-channel-2
                frequency:
                  type: integer
                  minimum: 1
                  description: Frequency in minutes between scheduled podcasts
                  example: 60
                instructions:
                  type: string
                  maxLength: 500
                  description: Optional instructions for podcast generation
                  example: Create a conversational podcast discussing the main points
                brandUrl:
                  type: string
                  format: uri
                  description: Optional brand/service URL to include in each podcast (URLs mode only)
                  example: https://yourbrand.com
                duration:
                  type: string
                  enum:
                  - short
                  - long
                  - default
                  description: Duration preference for podcasts
                  example: default
                style:
                  type: string
                  enum:
                  - deep dive
                  - brief
                  - critique
                  - debate
                  description: Style of podcast content
                  example: deep dive
                language:
                  type: string
                  description: Language for podcast generation
                  example: English
                podcastId:
                  type: string
                  description: Podcast show ID to associate episodes with
                episodeTitle:
                  type: string
                  description: Optional episode title when associating to a podcast show
                voice1:
                  type: integer
                  description: Numeric id of first voice from /content/GetVoices (if provided, will use custom voices mode)
                voice2:
                  type: integer
                  description: Numeric id of second voice from /content/GetVoices (requires voice1)
                startOn:
                  type: string
                  format: date-time
                  description: Start time for scheduling (defaults to current time, cannot be more than 24 hours in the past)
                  example: '2024-01-01T12:00:00Z'
                callbackData:
                  type: string
                  description: Optional data for webhook callbacks
                notebookId:
                  type: string
                  description: Notebook ID for enterprise clients
      responses:
        '200':
          description: Podcasts scheduled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the operation was successful
                  scheduled_requests:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        description: Response for URLs mode
                        properties:
                          request_id:
                            type: string
                            description: ID of the scheduled request
                          urls:
                            type: array
                            items:
                              type: string
                            description: Array of URLs this request was created from
                          scheduled_on:
                            type: string
                            format: date-time
                            description: When this request is scheduled to run
                          status:
                            type: integer
                            description: Initial status (0)
                      - type: object
                        description: Response for feedSelections / YouTube mode
                        properties:
                          request_id:
                            type: string
                            description: ID of the scheduled request
                          feed_ids:
                            type: array
                            items:
                              type: integer
                            description: Feed IDs used for this episode (if any)
                          feed_selections:
                            type: array
                            items:
                              $ref: '#/components/schemas/FeedSelection'
                            description: Feed selections used for this episode
                          feed_items_per_episode:
                            type: integer
                            description: Total cached items included across feeds for this episode
                          youtube_channel_ids:
                            type: array
                            items:
                              type: string
                            description: YouTube channel IDs used for this episode
                          episode_number:
                            type: integer
                            description: Episode number in the series
                          scheduled_on:
                            type: string
                            format: date-time
                            description: When this request is scheduled to run
                          status:
                            type: integer
                            description: Initial status (0)
                  total_created:
                    type: integer
                    description: Total number of requests created
                  start_time:
                    type: string
                    format: date-time
                    description: Start time used for scheduling
                  frequency_minutes:
                    type: integer
                    description: Frequency in minutes between requests
                  mode:
                    type: string
                    enum:
                    - URLs
                    - sources
                    description: Mode used for scheduling
                  total_feeds_per_episode:
                    type: integer
                    description: Number of feed groups per episode (sources mode only)
                  total_feed_items_per_episode:
                    type: integer
                    description: Number of cached feed items per episode (sources mode only)
                  total_youtube_channels_per_episode:
                    type: integer
                    description: Number of YouTube channels per episode (sources mode only)
                  total_urls:
                    type: integer
                    description: Total number of URLs across all episodes (URLs mode only)
        '400':
          description: Invalid request parameters or insufficient credits
        '401':
          description: Unauthorized
      operationId: postContentSchedule
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
components:
  schemas:
    ContentRequest:
      type: object
      required:
      - outputType
      properties:
        resources:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - text
                - youtube
                - website
                - pdf
                - file
              content:
                type: string
                description: For type "file", provide an https URL or a file id returned by POST /files. For other types, provide the text or URL expected by that type.
          description: Resources for content generation (required if topic, feedSelections, or researches are not provided)
        topic:
          type: string
          description: Topic for content generation (alternative to resources, feedSelections, or researches)
        feedSelections:
          type: array
          description: Cached feed items to include in the request (alternative to resources, topic, or researches)
          items:
            $ref: '#/components/schemas/FeedSelection'
        researches:
          type: array
          items:
            type: string
          description: Array of research IDs to include as text resources (max 10)
        projects:
          type: array
          items:
            type: string
          description: Array of project IDs to use as context for generation (max 10)
        logoUrl:
          type: string
          format: uri
          description: Optional HTTP or HTTPS PNG/JPG image URL for video, infographic, and slide_deck requests. Any source dimensions are accepted, but the image must be fully opaque and no larger than 5 MB; it is normalized to an opaque 200x50 PNG using the same rules as a project image. When supplied, it overrides the project logo for this request while project context and branding colors still apply. When omitted, the project logo and then the default logo are used.
        youtubeChannels:
          type: array
          items:
            type: string
          description: YouTube channel IDs already connected to the account to use as sources
        podcastEpisodeIds:
          type: array
          items:
            type: string
          description: Completed audio request IDs to reuse as podcast episode sources (max 10)
        text:
          type: string
          maxLength: 5000
          description: Instructions or query for content generation. For video, this is the NotebookLM steering prompt and is limited to 5,000 characters.
        outputType:
          type: string
          enum:
          - audio
          - text
          - faq
          - study_guide
          - timeline
          - briefing_doc
          - quiz
          - video
          - infographic
          - slide_deck
          - datatable
          description: Type of output content to generate
        duration:
          type: string
          enum:
          - short
          - default
          - long
          description: Duration preference for audio and slide deck generation. Ignored for video requests.
        format:
          type: string
          enum:
          - explainer
          - short
          - cinematic
          - text
          - html
          - pdf
          description: For `video`, accepted values are `explainer`, `short`, and `cinematic` (defaults to `explainer`). `cinematic` video requests cost 100 credits. For `briefing_doc`, accepted values are `text`, `html`, and `pdf` (defaults to `pdf`). Ignored for other output types.
        style:
          type: string
          maxLength: 5000
          description: 'Style of the generated content. For audio/text, use one of: deep dive, brief, critique, debate. For video, NotebookLM preset names (auto-select, classic, whiteboard, kawaii, anime, watercolour, retro print, heritage, or paper-craft) are selected directly; any other value is used as custom style text and is limited to 5,000 characters. Video defaults to classic when omitted.

            '
        introMusicUrl:
          type: string
          description: HTTPS URL to optional intro music (.mp3, .wav, or .m4a) mixed at lower volume at the start of the podcast
        includeCitations:
          type: boolean
          description: Whether to include citations (PRO only)
        ignorePaywalledResources:
          type: boolean
          description: When true, continue processing even if some URL resources fail to import (paywall/restrictions). The request fails only if none of the provided resources are successfully imported.
        infographicOrientation:
          type: string
          enum:
          - landscape
          - portrait
          - square
          description: Infographic orientation (defaults to landscape)
        infographicDetail:
          type: string
          enum:
          - concise
          - standard
          - detailed
          description: Infographic detail level (defaults to standard)
        slideDeckFormat:
          type: string
          enum:
          - detailed
          - presenter
          description: Slide deck format (defaults to detailed). Length is controlled via the standard duration field (short, default, long). Slide deck prompt uses the main text field.
        quizDifficulty:
          type: string
          enum:
          - easy
          - medium
          - hard
          description: Difficulty level for quiz outputs (defaults to medium). Quiz prompt uses the main text field.
        callbackData:
          type: string
          maxLength: 500
          description: Optional data to include in webhooks (maximum 500 characters)
        relatedId:
          type: string
          description: Existing request ID to relate this request to (must belong to the same token)
        notebookId:
          type: string
          description: Owned Private Notebook ID. When present, generation uses that notebook's saved sources and its license's exact dedicated account, follows Private Notebooks capacity instead of content credits, and rejects additional request sources or generic topic/project inputs.
        language:
          type: string
          description: Target language for generated content, using an exact value from the supported languages list (for example, Deutsch). For video at the base format price, set language and omit voice1 and voice2. Voice IDs select narration voices but do not translate the generated script.
        scheduledOn:
          type: string
          format: date-time
          description: Schedule the content generation for a specific time
        podcastId:
          type: string
          description: Podcast show ID to associate this content with
        episodeTitle:
          type: string
          description: Optional episode title when attaching to a podcast show
        title:
          type: string
          description: Custom title to use for generated video outputs. When provided, overrides the automatically generated title.
        titlePrompt:
          type: string
          description: Prompt to guide the generated video title
        descriptionPrompt:
          type: string
          description: Prompt to guide the generated video description
        thumbnailImagePrompt:
          type: string
          description: Prompt to control the generated thumbnail image for video outputs
        introImagePrompt:
          type: string
          description: Prompt to control the intro image for video outputs
        voice1:
          type: integer
          description: Primary explicit narration voice ID from /content/GetVoices. Use the numeric ID, not the voice name. For video, supplying any catalogue or client-cloned voice ID adds 200 credits once per request to the format base price (50 credits for explainer/short or 100 for cinematic). Omit voice1 and voice2 for base pricing. Voice selection does not translate the generated script.
        voice2:
          type: integer
          description: Optional secondary explicit narration voice ID from /content/GetVoices. Requires voice1. The 200-credit video voice surcharge is per request, not per supplied voice.
        publishTargets:
          type: array
          description: Targets to publish generated videos to (e.g., YouTube)
          items:
            $ref: '#/components/schemas/PublishTarget'
        templateMode:
          type: object
          description: Create a reusable template instead of processing immediately
          properties:
            type:
              type: string
              enum:
              - feed
            name:
              type: string
              description: Optional display name for the template
        isScheduled:
          type: boolean
          description: Create a recurring schedule instead of a single request
        dailyCount:
          type: integer
          minimum: 1
          maximum: 24
          description: Number of times per day to run when isScheduled is true
        scheduleEndDate:
          type: string
          format: date-time
          description: Optional end date for recurring schedules (requires isScheduled true)
    QueueRequestSummary:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
        request_type_id:
          type: integer
        output_type:
          type:
          - string
          - 'null'
        requested_on:
          type:
          - string
          - 'null'
          format: date-time
        processing_on:
          type:
          - string
          - 'null'
          format: date-time
        scheduled_on:
          type:
          - string
          - 'null'
          format: date-time
    FeedSelection:
      type: object
      required:
      - feedId
      - feedItemIds
      properties:
        feedId:
          type: integer
          description: Identifier of the feed containing the cached items
        feedItemIds:
          type: array
          items:
            type: string
          description: Identifiers of cached posts or videos to include from that feed
    Citation:
      type: object
      properties:
        text:
          type: string
          description: Citation text
        source:
          type: string
          description: Source of the citation
        page:
          type: integer
          description: Page number for PDF sources
        timeMs:
          type: integer
          description: Timestamp in milliseconds for audio/video sources
    QueueStats:
      type: object
      properties:
        success:
          type: boolean
        queued:
          type: integer
          description: Requests waiting to be picked up for processing
        processing:
          type: integer
          description: Requests currently in progress
        active:
          type: integer
          description: queued + processing
    QueueRequestsResponse:
      type: object
      properties:
        success:
          type: boolean
        state:
          type: string
          enum:
          - queued
          - processing
          - active
        ids:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueRequestSummary'
        count:
          type: integer
          description: Number of items in this page
        total_count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
    Usage:
      type: object
      properties:
        allowed:
          type: integer
          description: Total credits allowed
        used:
          type: integer
          description: Total credits used
        allowedDailyPodcasts:
          type: integer
          description: Daily podcast limit
        usedDailyPodcasts:
          type: integer
          description: Podcasts created today
    Transcript:
      type: object
      properties:
        id:
          type: string
          description: Transcript ID
        audioTitle:
          type: string
          description: Title of the original audio
        audioUrl:
          type: string
          description: URL to the original audio file
        responseText:
          type: string
          description: The transcript text content
        requestedOn:
          type: string
          format: date-time
          description: When the transcript was requested
        succeededOn:
          type: string
          format: date-time
          description: When the transcript was completed
        errorOn:
          type: string
          format: date-time
          description: When the transcript failed (if applicable)
        processingOn:
          type: string
          format: date-time
          description: When the transcript started processing (if applicable)
        errorMessage:
          type: string
          description: Error message if the transcript failed
        status:
          type: integer
          description: Current status of the transcript
        language:
          type: string
          description: Language of the transcript
        callbackData:
          type: string
          description: Optional callback data provided during request
        scheduledOn:
          type: string
          format: date-time
          description: When the transcript was scheduled
    Podcast:
      type: object
      properties:
        id:
          type: string
          description: Podcast ID
        requestTypeId:
          type: integer
          description: Type of podcast request
        audioTitle:
          type: string
          description: Title of the podcast
        audioUrl:
          type: string
          description: URL to the audio file
        responseText:
          type: string
          description: Podcast transcript/text
        requestedOn:
          type: string
          format: date-time
          description: When the podcast was requested
        succeededOn:
          type: string
          format: date-time
          description: When the podcast was completed
        errorOn:
          type: string
          format: date-time
          description: When the podcast failed (if applicable)
        processingOn:
          type: string
          format: date-time
          description: When the podcast started processing (if applicable)
        errorMessage:
          type: string
          description: Error message if the podcast failed
        status:
          type: integer
          description: Current status of the podcast
        shareUrl:
          type: string
          description: Public sharing URL for the podcast
    RepurposeRequest:
      type: object
      required:
