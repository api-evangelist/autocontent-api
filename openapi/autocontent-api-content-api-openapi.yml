openapi: 3.2.0
info:
  title: Autocontent Content API
  version: '1.0'
  description: 'Operations tagged Content across 2 of this provider''s published API definitions: autocontent-api-legacy-content-openapi.json, autocontent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.autocontentapi.com
tags:
- name: Content
  description: Content operations and usage information
paths:
  /content/Usage:
    get:
      summary: Get usage information
      description: Returns current usage statistics and remaining credits
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          description: Unauthorized
      operationId: getContentUsage
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/QueueStats:
    get:
      summary: Get queued and processing request counts
      description: Returns lightweight queue counts for the authenticated client. Active means queued + processing.
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStats'
        '401':
          description: Unauthorized
      operationId: getContentQueueStats
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/QueueRequests:
    get:
      summary: Get queued or processing request IDs
      description: Returns paginated request IDs and lightweight request metadata for the authenticated client.
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - queued
          - processing
          - active
          - all
          default: active
        description: Request state to fetch. `active` means queued + processing; `all` is accepted as an alias for active.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        required: false
        description: Page number for pagination, starting at 1.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        required: false
        description: Number of items per page.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueRequestsResponse'
        '400':
          description: Invalid state
        '401':
          description: Unauthorized
      operationId: getContentQueueRequests
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Podcasts:
    get:
      summary: Get all podcasts
      description: Returns all podcasts created by the current client, optionally filtered by status. Supports optional pagination.
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - all
          - queued
          - failed
          - succeeded
          - processed
          default: all
        description: Filter podcasts by status (all=all podcasts, queued=status=0 and no error, failed=has errorOn, succeeded=status=100, processed=has processingOn)
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        required: false
        description: Page number for pagination (starts at 1). If not provided, returns all results.
        example: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
        required: false
        description: Number of items per page (max 100, default 50 if page is specified)
        example: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  description: Non-paginated response (when page and limit are not provided)
                  items:
                    $ref: '#/components/schemas/Podcast'
                - type: object
                  description: Paginated response (when page or limit are provided)
                  properties:
                    podcasts:
                      type: array
                      items:
                        $ref: '#/components/schemas/Podcast'
                    totalCount:
                      type: integer
                      description: Total number of podcasts
                      example: 100
                    page:
                      type: integer
                      description: Current page number
                      example: 1
                    pageSize:
                      type: integer
                      description: Number of items per page
                      example: 20
                    totalPages:
                      type: integer
                      description: Total number of pages
                      example: 5
        '400':
          description: Invalid status parameter
        '401':
          description: Unauthorized
      operationId: getContentPodcasts
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Transcripts:
    get:
      summary: Get all transcripts
      description: Returns all transcripts created by the current client, optionally filtered by status. Supports optional pagination.
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - all
          - queued
          - failed
          - succeeded
          - processed
          default: all
        description: Filter transcripts by status (all=all transcripts, queued=status=0 and no error, failed=has errorOn, succeeded=status=100, processed=has processingOn)
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        required: false
        description: Page number for pagination (starts at 1). If not provided, returns all results.
        example: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
        required: false
        description: Number of items per page (max 100, default 50 if page is specified)
        example: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  description: Non-paginated response (when page and limit are not provided)
                  items:
                    $ref: '#/components/schemas/Transcript'
                - type: object
                  description: Paginated response (when page or limit are provided)
                  properties:
                    transcripts:
                      type: array
                      items:
                        $ref: '#/components/schemas/Transcript'
                    totalCount:
                      type: integer
                      description: Total number of transcripts
                      example: 100
                    page:
                      type: integer
                      description: Current page number
                      example: 1
                    pageSize:
                      type: integer
                      description: Number of items per page
                      example: 20
                    totalPages:
                      type: integer
                      description: Total number of pages
                      example: 5
        '400':
          description: Invalid status parameter
        '401':
          description: Unauthorized
      operationId: getContentTranscripts
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Create:
    post:
      summary: Create new content
      description: Generate new content based on resources, topic, feed selections, researches, YouTube channels, or linked podcast episodes. Use video metadata fields (titlePrompt, descriptionPrompt, thumbnailImagePrompt, introImagePrompt, voices, publishTargets, format) when outputType is video. Video formats are explainer and short at 50 credits, or cinematic at 100 credits. Supplying voice1 or voice2 adds one 200-credit explicit-voice surcharge to a video request, including when the ID is from the global GetVoices catalogue. Video requests ignore the generic duration field if it is provided. Set isScheduled or templateMode to create recurring templates instead of immediate processing.
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Standard immediate request
                  properties:
                    request_id:
                      type: string
                      description: Unique ID for tracking the request
                    status:
                      type: integer
                      description: Initial status code (0)
                - type: object
                  description: Response when creating a recurring schedule (isScheduled = true)
                  properties:
                    schedule_id:
                      type: string
                    request_id:
                      type: string
                    status:
                      type: integer
                    message:
                      type: string
                    dailyCount:
                      type: integer
                    endDate:
                      type:
                      - string
                      - 'null'
                      format: date-time
                - type: object
                  description: Response when creating a reusable template (templateMode)
                  properties:
                    template_request_id:
                      type: string
                    request_id:
                      type: string
                    status:
                      type: integer
                    template:
                      type: object
                      properties:
                        type:
                          type: string
                        name:
                          type:
                          - string
                          - 'null'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentCreate
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Repurpose:
    post:
      summary: Repurpose a completed request
      description: Creates a new request using the resources and parameters of a completed request, allowing a new output type and optional updated text.
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepurposeRequest'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique ID for tracking the new request
                  status:
                    type: integer
                    description: Initial status code (0)
        '400':
          description: Invalid request or request not completed
        '401':
          description: Unauthorized
        '404':
          description: Original request not found
      operationId: postContentRepurpose
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Status/{id}:
    get:
      summary: Check request status
      description: Get the status of a content generation request. A non-null `error_on` or non-zero `error_code` is a terminal failure; the numeric `status` may remain at its last processing stage, including 0.
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Request ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    id:
                      type: string
                      description: Request ID
                    audio_title:
                      type: string
                      description: Title of the generated audio
                    status:
                      type: integer
                      description: Status code (100 = completed)
                    audio_url:
                      type: string
                      description: URL to the generated audio file
                    video_url:
                      type: string
                      description: URL to the generated video file (if applicable)
                    image_url:
                      type: string
                      description: URL to the generated image file (if applicable)
                    response_text:
                      type: string
                      description: Generated text content
                    requested_on:
                      type: string
                      format: date-time
                      description: When the request was created
                    callback_data:
                      type: string
                      description: User-provided callback data
                    updated_on:
                      type: string
                      format: date-time
                      description: When the request was last updated
                    request_type_id:
                      type: integer
                      description: Type of request
                    error_code:
                      type: integer
                      description: Error code (0 if no error)
                    citations:
                      type: array
                      items:
                        $ref: '#/components/schemas/Citation'
                      description: Citations if requested
                    file_size:
                      type: integer
                      description: Size of the generated file in bytes
                    audio_duration:
                      type: number
                      description: Duration of the audio in seconds
                    share_url:
                      type: string
                      description: Public sharing URL for the content
                    briefing_doc_url:
                      type: string
                      description: Direct URL to the generated Briefing Doc PDF when output type is `briefing_doc`
                    document_format:
                      type: string
                      description: Stored document format when output type is `briefing_doc`
                    document_content:
                      type: string
                      description: Stored text or HTML content when output type is `briefing_doc`
                    document_url:
                      type: string
                      description: Stored PDF URL when output type is `briefing_doc`
                - type: object
                  properties:
                    id:
                      type: string
                      description: Request ID
                    status:
                      type: integer
                      description: Status code (0 = pending, other values indicate processing stages)
                    updated_on:
                      type: string
                      format: date-time
                      description: When the request was last updated
                    error_code:
                      type: integer
                      description: Error code (0 if no error)
                    error_message:
                      type: string
                      description: Error message if any
                    requested_on:
                      type: string
                      format: date-time
                      description: When the request was created
                    callback_data:
                      type: string
                      description: User-provided callback data
        '401':
          description: Unauthorized
        '404':
          description: Request not found
      operationId: getContentStatusById
      x-operation-id-source: derived
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    servers:
    - url: https://api.autocontentapi.com
  /content/List:
    get:
      summary: List content requests
      description: Get a list of content generation requests. Supports optional pagination.
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        required: false
        description: Page number for pagination (starts at 1). If not provided, returns all results.
        example: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
        required: false
        description: Number of items per page (max 100, default 50 if page is specified)
        example: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  description: Non-paginated response (when page and limit are not provided)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Request ID
                      requestTypeId:
                        type: integer
                        description: Type of content request
                      status:
                        type: integer
                        description: Current status code
                      requestedOn:
                        type: string
                        format: date-time
                        description: Request creation timestamp
                      audioTitle:
                        type: string
                        description: Title of the generated audio (if available)
                - type: object
                  description: Paginated response (when page or limit are provided)
                  properties:
                    requests:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Request ID
                          requestTypeId:
                            type: integer
                            description: Type of content request
                          status:
                            type: integer
                            description: Current status code
                          requestedOn:
                            type: string
                            format: date-time
                            description: Request creation timestamp
                          audioTitle:
                            type: string
                            description: Title of the generated audio (if available)
                    totalCount:
                      type: integer
                      description: Total number of requests
                      example: 100
                    page:
                      type: integer
                      description: Current page number
                      example: 1
                    pageSize:
                      type: integer
                      description: Number of items per page
                      example: 20
                    totalPages:
                      type: integer
                      description: Total number of pages
                      example: 5
        '401':
          description: Unauthorized
      operationId: getContentList
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/GetVoices:
    get:
      summary: Get available voices
      description: List all available voices for audio generation
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Numeric voice ID to pass as voice1, voice2, or voiceId in voice-enabled requests. For /content/Create video requests, any supplied voice1 or voice2 ID adds one 200-credit explicit-voice surcharge, whether this is a global catalogue voice or a client-cloned voice.
                    name:
                      type: string
                      description: Voice name
                    clientId:
                      type: string
                      description: ID of the client that owns this voice (for custom voices)
        '401':
          description: Unauthorized
      operationId: getContentGetVoices
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Me:
    get:
      summary: Get current client info
      description: Returns current client ID
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId:
                    type: string
                    description: Current authenticated client ID
        '401':
          description: Unauthorized
      operationId: getContentMe
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Webhook:
    post:
      summary: Register webhook
      description: Register an HTTPS webhook URL for terminal request notifications. Callbacks are sent for both successes and failures; failure callbacks include `error_code` and `error_message`.
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  description: Webhook URL to register
      responses:
        '200':
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Webhook ID
                  url:
                    type: string
                    description: Registered webhook URL
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentWebhook
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/RemoveWebhook:
    post:
      summary: Remove webhook
      description: Remove a registered webhook
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: ID of the webhook to remove
      responses:
        '200':
          description: Webhook removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the operation was successful
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentRemoveWebhook
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/Webhooks:
    get:
      summary: Get webhooks
      description: List all registered webhooks
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Webhook ID
                    url:
                      type: string
                      description: Registered webhook URL
        '401':
          description: Unauthorized
      operationId: getContentWebhooks
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/ModifyPodcast:
    post:
      summary: Modify podcast
      description: Modify an existing podcast with new voices and background music
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - audioUrl
              - voice1
              - voice2
              properties:
                audioUrl:
                  type: string
                  description: URL to the audio file to modify
                voice1:
                  type: integer
                  description: Numeric id of first voice from /content/GetVoices
                voice2:
                  type: integer
                  description: Numeric id of second voice from /content/GetVoices
                instructions:
                  type: string
                  description: Additional instructions
                backgroundMusicUrl:
                  type: string
                  description: Optional URL to background music file
                callbackData:
                  type: string
                  description: Optional data for webhook callbacks
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique ID for tracking the request
                  status:
                    type: integer
                    description: Initial status code (0)
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentModifyPodcast
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/SeparateSpeakersAudio:
    post:
      summary: Separate speakers in audio
      description: Separate speakers in an audio file
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - audioUrl
              properties:
                audioUrl:
                  type: string
                  description: URL to the audio file
                callbackData:
                  type: string
                  description: Optional data for webhook callbacks
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique ID for tracking the request
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentSeparateSpeakersAudio
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/CloneVoice:
    post:
      summary: Clone voice
      description: Clone a voice from an audio file (PRO only). Accepts either a file upload or a URL.
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - name
              properties:
                audioFile:
                  type: string
                  format: binary
                  description: MP3 audio file to upload (max 10MB). Cannot be used with audioUrl.
                name:
                  type: string
                  description: Name for the cloned voice
          application/json:
            schema:
              type: object
              required:
              - audioUrl
              - name
              properties:
                audioUrl:
                  type: string
                  description: URL to the MP3 audio file for voice cloning. Cannot be used with audioFile upload.
                name:
                  type: string
                  description: Name for the cloned voice
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique ID for tracking the request
                  status:
                    type: integer
                    description: Initial status code (0)
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      operationId: postContentCloneVoice
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/GetTranscript:
    post:
      summary: Get transcript
      description: Generate transcript from an audio file or episode. Accepts file upload, URL, or episode ID (only one at a time).
      tags:
      - Content
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audioFile:
                  type: string
                  format: binary
                  description: MP3 or WAV audio file to upload (max 50MB). Cannot be used with audioUrl or episodeId.
                callbackData:
                  type: string
                  description: Optional data for webhook callbacks
          application/json:
            schema:
              type: object
              oneOf:
              - required:
                - audioUrl
              - required:
                - episodeId
              properties:
                audioUrl:
                  type: string
                  description: URL to the audio file (.mp3 or .wav format). Cannot be used with audioFile or episodeId.
                episodeId:
                  type: string
                  description: ID of an existing episode to transcribe. Cannot be used with audioFile or audioUrl.
                callbackData:
                  type: string
                  description: Optional data for webhook callbacks
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique ID for tracking the request
                  status:
                    type: integer
                    description: Initial status code (0)
        '400':
          description: Invalid request (missing parameters, both parameters provided, or invalid audio format)
        '401':
          description: Unauthorized
      operationId: postContentGetTranscript
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /content/GetTranscript/{episodeId}:
    get:
      summary: Get transcript by episode ID
      description: Retrieve an existing transcript for a specific episode
      tags:
      - Content
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: episodeId
        required: true
        schema:
          type: string
        description: The ID of the episode to get the transcript for
      responses:
        '200':
          description: Transcript retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the operation was successful
                  episodeId:
