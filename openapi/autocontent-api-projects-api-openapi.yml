openapi: 3.2.0
info:
  title: Autocontent Projects API
  version: 1.0.0
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: autocontent-api-legacy-content-openapi.json, autocontent-api-platform-v1-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.autocontentapi.com
- url: https://api.autocontentapi.com/v1
tags:
- name: Projects
  description: Project context management for content generation
paths:
  /projects:
    get:
      summary: Get all projects for the authenticated user
      description: 'Retrieves all active projects owned by the authenticated user.

        Projects are returned in descending order by last update time.'
      tags:
      - Projects
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of user's projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized - valid API token required
        '500':
          description: Internal server error
      operationId: getProjects
      x-operation-id-source: derived
    post:
      summary: Create a new project
      description: 'Creates a new project for the authenticated user.

        Projects can be referenced when generating tweets/threads to provide context.


        If a URL is provided without a description, the API will:

        1. Fetch the website content

        2. Use AI to generate a comprehensive project description in markdown format


        Either description or url must be provided.'
      tags:
      - Projects
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Bad request - Missing required fields or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    examples:
                      missing_name:
                        value: 'Missing required field: name'
                      missing_description_or_url:
                        value: Either description or url must be provided
                      name_too_long:
                        value: Project name must be 200 characters or less
                      transparent_project_image:
                        value: 'Invalid project image: Project images must be fully opaque. Transparent or partially transparent pixels are not allowed.'
        '401':
          description: Unauthorized - valid API token required
        '500':
          description: Internal server error
      operationId: postProjects
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /projects/{id}:
    get:
      summary: Get a specific project by ID
      description: 'Retrieves a specific project by its ID.

        Only the project owner can access their projects.'
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Project ID (GUID)
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request - Missing project ID
        '401':
          description: Unauthorized - valid API token required
        '404':
          description: Project not found
        '500':
          description: Internal server error
      operationId: getProjectsById
      x-operation-id-source: derived
    patch:
      operationId: updateProject
      summary: Edit and confirm a Project profile
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: Idempotency-Key
        in: header
        required: true
        description: 1–255 visible ASCII bytes; UUID recommended.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  x-max-utf8-bytes: 200
                description:
                  type: string
                  minLength: 0
                  maxLength: 4000
                  x-max-utf8-bytes: 4000
                category:
                  type: string
                  minLength: 0
                  maxLength: 500
                  x-max-utf8-bytes: 500
                audience:
                  type: string
                  minLength: 0
                  maxLength: 2000
                  x-max-utf8-bytes: 2000
                relevant_keywords:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                    x-max-utf8-bytes: 200
                competitor_keywords:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                    x-max-utf8-bytes: 200
                excluded_keywords:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                    x-max-utf8-bytes: 200
                allow_competitor_mentions:
                  type: boolean
                research_locale:
                  type: string
                  minLength: 2
                  maxLength: 255
                  format: bcp47
                crawl_scope:
                  type: object
                  properties:
                    root_url:
                      type: string
                      minLength: 1
                      maxLength: 2048
                      format: uri
                      x-max-utf8-bytes: 2048
                  required:
                  - root_url
                  additionalProperties: false
                brand:
                  type: object
                  properties:
                    colors:
                      maxItems: 8
                      type: array
                      items:
                        type: string
                        pattern: ^#[0-9A-F]{6}$
                    instructions:
                      type: string
                      minLength: 0
                      maxLength: 2000
                      x-max-utf8-bytes: 2000
                    default_voice_id:
                      anyOf:
                      - type: string
                        pattern: ^voice_[A-Za-z0-9_-]+$
                      - type: 'null'
                    default_avatar_id:
                      anyOf:
                      - type: string
                        pattern: ^avatar_[A-Za-z0-9_-]+$
                      - type: 'null'
                  additionalProperties: false
                confirmed:
                  type: boolean
                  const: true
              additionalProperties: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
        default:
          $ref: '#/components/responses/AutoContentError'
    delete:
      operationId: archiveProject
      summary: Archive a Project and its Loops
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
        default:
          $ref: '#/components/responses/AutoContentError'
    servers:
    - url: https://api.autocontentapi.com
  /projects/{id}/update:
    post:
      summary: Update a project
      description: 'Updates an existing project''s name and description.

        Only the project owner can update their projects.


        If a URL is provided without a description, the API will:

        1. Fetch the website content

        2. Use AI to generate a comprehensive project description in markdown format


        Either description or url must be provided.'
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Project ID (GUID)
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Bad request - Missing required fields or validation error
        '401':
          description: Unauthorized - valid API token required
        '404':
          description: Project not found or unauthorized
        '500':
          description: Internal server error
      operationId: postProjectsByIdUpdate
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /projects/{id}/delete:
    post:
      summary: Delete a project
      description: 'Soft deletes a project (marks it as inactive).

        Only the project owner can delete their projects.'
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Project ID (GUID)
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Project deleted successfully
        '400':
          description: Bad request - Missing project ID
        '401':
          description: Unauthorized - valid API token required
        '404':
          description: Project not found or unauthorized
        '500':
          description: Internal server error
      operationId: postProjectsByIdDelete
      x-operation-id-source: derived
    servers:
    - url: https://api.autocontentapi.com
  /projects/{id}/logo:
    put:
      operationId: replaceProjectLogo
      summary: Replace the primary Project logo revision
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: Idempotency-Key
        in: header
        required: true
        description: 1–255 visible ASCII bytes; UUID recommended.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_url:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  format: uri
                  x-max-utf8-bytes: 2048
              required:
              - source_url
              additionalProperties: false
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
        default:
          $ref: '#/components/responses/AutoContentError'
    delete:
      operationId: removeProjectLogo
      summary: Clear the primary Project logo for future work
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
        default:
          $ref: '#/components/responses/AutoContentError'
    servers:
    - url: https://api.autocontentapi.com/v1
  /projects/{id}/refresh:
    post:
      operationId: refreshProject
      summary: Refresh Project website analysis
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: id
