                ownership_attested:
                  type: boolean
                  const: true
              required:
              - source_url
              - display_name
              - consent_attested
              - ownership_attested
              additionalProperties: false
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              - display_name
              - consent_attested
              - ownership_attested
              properties:
                file:
                  type: string
                  format: binary
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  x-max-utf8-bytes: 80
                consent_attested:
                  type: boolean
                  const: true
                ownership_attested:
                  type: boolean
                  const: true
      responses:
        '202':
          description: Successful response.
          content:
