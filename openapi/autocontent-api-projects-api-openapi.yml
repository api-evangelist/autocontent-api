      summary: Create a Source collection
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: Idempotency-Key
        in: header
        required: true
        description: 1–255 visible ASCII bytes; UUID recommended.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  x-max-utf8-bytes: 200
              required:
              - name
              additionalProperties: false
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/AutoContentError'
    get:
      operationId: listCollections
      summary: List Source collections
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.read
      x-principal: oauth_or_api_key
      x-idempotency-required: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: limit
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9]|[1-9][0-9]|100)$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
                  next_cursor:
                    oneOf:
                    - type: string
                      minLength: 1
                    - type: 'null'
        default:
          $ref: '#/components/responses/AutoContentError'
    servers:
    - url: https://api.autocontentapi.com/v1
  /projects/{id}/sources:
    post:
      operationId: createSource
      summary: Add a Project Source
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: Idempotency-Key
        in: header
        required: true
        description: 1–255 visible ASCII bytes; UUID recommended.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    const: url
                  url:
                    type: string
                    minLength: 1
                    maxLength: 2048
                    format: uri
                    x-max-utf8-bytes: 2048
                  title: {}
                  collection_id:
                    type: string
                    pattern: ^col_[A-Za-z0-9_-]+$
                required:
                - type
                - url
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                    const: youtube
                  url:
                    type: string
                    minLength: 1
                    maxLength: 2048
                    format: uri
                    x-max-utf8-bytes: 2048
                  title: {}
                  collection_id:
                    type: string
                    pattern: ^col_[A-Za-z0-9_-]+$
                required:
                - type
                - url
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                    const: text
                  text: {}
                  title: {}
                  collection_id:
                    type: string
                    pattern: ^col_[A-Za-z0-9_-]+$
                required:
                - type
                - text
                - title
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                    const: product_visual
                  url:
                    type: string
                    minLength: 1
                    maxLength: 2048
                    format: uri
                    x-max-utf8-bytes: 2048
                  title: {}
                  collection_id:
                    type: string
                    pattern: ^col_[A-Za-z0-9_-]+$
                required:
                - type
                - url
                additionalProperties: false
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                collection_id:
                  type: string
                  pattern: ^col_[A-Za-z0-9_-]+$
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  x-max-utf8-bytes: 500
                keep_as_project_asset:
                  type: boolean
                  default: true
                  description: Set false to keep the upload request-only; it expires after 24 hours unless claimed by a Generation.
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        default:
          $ref: '#/components/responses/AutoContentError'
    get:
      operationId: listSources
      summary: List Project Sources
      tags:
      - Projects
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.read
      x-principal: oauth_or_api_key
      x-idempotency-required: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: limit
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9]|[1-9][0-9]|100)$
      - name: collection_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^col_[A-Za-z0-9_-]+$
      - name: query
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          x-max-utf8-bytes: 200
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                  next_cursor:
                    oneOf:
                    - type: string
                      minLength: 1
                    - type: 'null'
        default:
          $ref: '#/components/responses/AutoContentError'
    servers:
    - url: https://api.autocontentapi.com/v1
