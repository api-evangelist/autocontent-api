openapi: 3.2.0
info:
  title: AutoContent Platform Content Loops API
  version: 1.0.0
  description: First-class content Assets with prepaid USD billing. Generic document and video routes do not exist.
servers:
- url: https://api.autocontentapi.com/v1
tags:
- name: content-loops
paths:
  /content-loops:
    post:
      operationId: createContentLoop
      summary: Create and schedule a Content Loop
      tags:
      - content-loops
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.write
      - platform.generate
      x-principal: oauth_or_api_key
      x-idempotency-required: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 1–255 visible ASCII bytes; UUID recommended.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                  pattern: ^prj_[A-Za-z0-9_-]+$
                input:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: trend
                      lookback_days:
                        type: integer
                        minimum: 1
                        maximum: 30
                      instructions:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        x-max-utf8-bytes: 4000
                    required:
                    - type
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: topic
                      topic:
                        type: string
                        minLength: 1
                        maxLength: 2000
                        x-max-utf8-bytes: 2000
                      evidence_scope:
                        type: string
                        enum:
                        - project
                        - project_and_web
                      lookback_days:
                        type: integer
                        minimum: 1
                        maximum: 30
                      source_ids:
                        minItems: 1
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          pattern: ^src_[A-Za-z0-9_-]+$
                        uniqueItems: true
                      collection_ids:
                        minItems: 1
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          pattern: ^col_[A-Za-z0-9_-]+$
                        uniqueItems: true
                      instructions:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        x-max-utf8-bytes: 4000
                    required:
                    - type
                    - topic
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: knowledge
                      source_ids:
                        minItems: 1
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          pattern: ^src_[A-Za-z0-9_-]+$
                        uniqueItems: true
                      collection_ids:
                        minItems: 1
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          pattern: ^col_[A-Za-z0-9_-]+$
                        uniqueItems: true
                      instructions:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        x-max-utf8-bytes: 4000
                    required:
                    - type
                    additionalProperties: false
                instructions:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  x-max-utf8-bytes: 4000
                schedule:
                  oneOf:
                  - type: object
                    properties:
                      frequency:
                        type: string
                        const: daily
                      local_time:
                        type: string
                        pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                      timezone:
                        type: string
                        minLength: 1
                        maxLength: 100
                        format: iana-time-zone
                    required:
                    - frequency
                    - local_time
                    - timezone
                    additionalProperties: false
                  - type: object
                    properties:
                      frequency:
                        type: string
                        const: weekly
                      day_of_week:
                        type: string
                        enum:
                        - monday
                        - tuesday
                        - wednesday
                        - thursday
                        - friday
                        - saturday
                        - sunday
                      local_time:
                        type: string
                        pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                      timezone:
                        type: string
                        minLength: 1
                        maxLength: 100
                        format: iana-time-zone
                    required:
                    - frequency
                    - day_of_week
                    - local_time
                    - timezone
                    additionalProperties: false
                  - type: object
                    properties:
                      frequency:
                        type: string
                        const: monthly
                      day_of_month:
                        type: integer
                        minimum: 1
                        maximum: 31
                      local_time:
                        type: string
                        pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
                      timezone:
                        type: string
                        minLength: 1
                        maxLength: 100
                        format: iana-time-zone
                    required:
                    - frequency
                    - day_of_month
                    - local_time
                    - timezone
                    additionalProperties: false
                assets:
                  minItems: 1
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      asset_type:
                        type: string
                        enum:
                        - article
                        - lead_magnet
                        - ebook
                        - slides
                        - infographic
                        - quiz
                        - podcast_episode
                        - short_video
                        - explainer_video
                        - launch_video
                        - product_demo_video
                        - ad_video
                      instructions:
                        type: string
                        minLength: 1
                        maxLength: 4000
                        x-max-utf8-bytes: 4000
                      language:
                        type: string
                        minLength: 2
                        maxLength: 255
                        format: bcp47
                      options:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      voice_id:
                        type: string
                        pattern: ^voice_[A-Za-z0-9_-]+$
                      avatar_id:
                        type: string
                        pattern: ^avatar_[A-Za-z0-9_-]+$
                      model:
                        type: string
                        minLength: 1
                        maxLength: 200
                      model_options:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                    required:
                    - asset_type
                    additionalProperties: false
                    dependentRequired:
                      model_options:
                      - model
                  x-unique-by: asset_type
                language:
                  type: string
                  minLength: 2
                  maxLength: 255
                  format: bcp47
                max_cost_per_run_usd:
                  type: string
                  pattern: ^(0|[1-9][0-9]{0,5})\.[0-9]{2}$
                max_cost_per_month_usd:
                  type: string
                  pattern: ^(0|[1-9][0-9]{0,5})\.[0-9]{2}$
              required:
              - project_id
              - input
              - schedule
              - assets
              - max_cost_per_run_usd
              - max_cost_per_month_usd
              additionalProperties: false
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLoop'
        default:
          $ref: '#/components/responses/AutoContentError'
    get:
      operationId: listContentLoops
      summary: List Content Loops
      tags:
      - content-loops
      security:
      - platformOAuth: []
      - platformApiKey: []
      x-required-scopes:
      - platform.read
      x-principal: oauth_or_api_key
      x-idempotency-required: false
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: limit
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:[1-9]|[1-9][0-9]|100)$
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^prj_[A-Za-z0-9_-]+$
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - paused
          - archived
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentLoop'
                  next_cursor:
                    oneOf:
                    - type: string
                      minLength: 1
                    - type: 'null'
        default:
          $ref: '#/components/responses/AutoContentError'
