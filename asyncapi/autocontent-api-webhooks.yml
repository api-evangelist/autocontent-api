  limits:
    error_code: webhook_limit_exceeded
    max_destinations: null
    note: A destination limit exists (it has its own error code) but the number is not published.
  security:
    scheme: HMAC-SHA256
    signed_payload: '<unix timestamp>.<raw body>'
    signature_header: x-autocontent-signature
    event_id_header: x-autocontent-event-id
    timestamp_tolerance_seconds: 300
    verification_rules:
    - Read the exact raw request bytes and verify BEFORE JSON parsing.
    - Require x-autocontent-event-id to equal body.id.
    - Reject timestamps outside a +/-300 second window.
    - Deduplicate by event ID.
    sdk_helper: AutoContent.webhooks.constructEvent
    secret_env: AUTOCONTENT_WEBHOOK_SECRET
  handler_guidance:
