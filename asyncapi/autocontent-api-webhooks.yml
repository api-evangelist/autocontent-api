webhooks:
  published: true
  docs: https://autocontentapi.com/developers/webhooks
  transport: HTTPS POST to a caller-registered destination
  management:
  - operationId: createWebhook
    method: POST
    path: /webhooks
    scope: platform.write
    idempotent: true
  - operationId: listWebhooks
    method: GET
    path: /webhooks
    scope: platform.write
  - operationId: deleteWebhook
