apis:
- aid: autocontent-api:podcast-generation
  name: Podcast Generation API
  description: >-
    Generate AI-powered podcast episodes from URLs, PDFs, YouTube videos, plain text, or social media
    feeds. Produces MP3 audio with metadata using NotebookLM-style AI with support for standard voices
    and custom voice cloning. Consumes 10 credits per episode.
  humanURL: https://autocontentapi.com
  baseURL: https://api.autocontentapi.com
  tags:
  - Artificial Intelligence
  - Podcast
  - Audio
  - Content Generation
  tags_raw:
  - AI
  - Podcast
  - Audio
  - Content Generation
  properties:
  - type: Documentation
    url: https://docs.autocontentapi.com/
  - type: Authentication
    url: https://autocontentapi.com/developers/api
- aid: autocontent-api:video-generation
  name: Video Generation API
  description: >-
    Programmatically produce explainer videos and short-form vertical video content (9:16 format) from
    text, URLs, and other source content. Explainer videos consume 50 credits; video shorts consume 400
    credits. Output is delivered as MP4 video files.
  humanURL: https://autocontentapi.com
  baseURL: https://api.autocontentapi.com
  tags:
  - Artificial Intelligence
  - Video
  - Content Generation
  tags_raw:
  - AI
  - Video
  - Content Generation
  properties:
  - type: Documentation
    url: https://docs.autocontentapi.com/
- aid: autocontent-api:deep-research
  name: Deep Research API
  description: >-
    Performs multi-step AI reasoning that browses the live web, reads reputable sources, and synthesizes
    comprehensive research reports. Supports output as structured JSON, HTML blog posts, and study guides.
    Consumes 100-200 credits per research session.
  humanURL: https://autocontentapi.com
  baseURL: https://api.autocontentapi.com
  tags:
  - Artificial Intelligence
  - Research
  - Content Generation
  tags_raw:
  - AI
  - Research
  - Content Generation
  properties:
  - type: Documentation
    url: https://docs.autocontentapi.com/
- aid: autocontent-api:infographics-quizzes
  name: Infographics and Quizzes API
  description: >-
    Transform source content into visual infographics and interactive quiz formats. Consumes 10-30 credits
    per asset. Supports diverse input types and produces structured HTML and visual media output.
  humanURL: https://autocontentapi.com
