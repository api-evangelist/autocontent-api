- aid: autocontent-api:platform-api-v1
  name: AutoContent Platform API v1
  description: >-
    The current AutoContent product: a Project-centred, scope-based REST API that turns a website,
    reusable Knowledge or a bounded topic into first-class content Assets — articles, lead magnets,
    ebooks, slides, infographics, quizzes, podcast episodes and five video products. 55 operations
    across 39 paths, prepaid USD billing quoted by a non-consuming preview endpoint and accepted
    under a caller-supplied max_cost_usd ceiling, cursor pagination, Idempotency-Key on keyed
    mutations, signed webhooks, and a hosted OAuth MCP service over the same scopes.
  humanURL: https://autocontentapi.com/developers
  baseURL: https://api.autocontentapi.com/v1
