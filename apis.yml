apis:
- aid: autocontent-api:podcast-generation
  name: Podcast Generation API
  description: >-
    Generate AI-powered podcast episodes from URLs, PDFs, YouTube videos, plain text, or social media
    feeds. Produces MP3 audio with metadata using NotebookLM-style AI with support for standard voices
    and custom voice cloning. Consumes 10 credits per episode.
  humanURL: https://autocontentapi.com
  baseURL: https://api.autocontentapi.com
  tags:
