- aid: autocontent-api:video-generation
  name: Video Generation API
  description: >-
    Programmatically produce explainer videos and short-form vertical video content (9:16 format) from
    text, URLs, and other source content. Explainer videos consume 50 credits; video shorts consume 400
    credits. Output is delivered as MP4 video files.
  humanURL: https://autocontentapi.com
  baseURL: https://api.autocontentapi.com
