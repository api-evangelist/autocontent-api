- aid: autocontent-api:legacy-content-api
  name: AutoContent legacy Content API
  description: >-
    The original AutoContent surface, served unversioned at https://api.autocontentapi.com with its
    own JWT credentials and monthly credit plans. 106 operations across 99 paths covering podcasts,
    explainer and short video, deep research, infographics, quizzes, slide decks, data tables,
    documents, files, X/Twitter and Reddit feeds, sharing and billing. The provider states it is not
    a compatibility alias for the Platform /v1 API and publishes a migration guide, but no sunset
    date.
  humanURL: https://docs.autocontentapi.com/
  baseURL: https://api.autocontentapi.com
